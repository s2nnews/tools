<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Daily Streak Screener</title>
    <style>
        .chart-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-top: 20px;
        }
        .chart-item {
            text-align: center;
            border: 1px solid #eee;
            padding: 10px;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            transition: transform 0.3s ease;
        }
        .chart-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        .chart-item img {
            max-width: 100%;
            height: auto;
            display: block;
            margin: 0 auto;
            cursor: pointer;
        }
        .chart-item h3 {
            margin: 10px 0;
            font-size: 16px;
            color: #333;
        }
        h2 {
            text-align: center;
            margin: 20px 0;
            color: #333;
        }
        .section-header {
            text-align: center;
            padding: 10px;
            margin: 20px 0 10px 0;
            font-size: 18px;
            font-weight: bold;
            color: white;
        }
        .up-header {
            background-color: #4CAF50;
        }
        .down-header {
            background-color: #f44336;
        }
        @media (max-width: 1200px) {
            .chart-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
        @media (max-width: 768px) {
            .chart-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

<div class="section-header up-header">Up Streaks (5+ days)</div>
<div class='chart-grid'>

    <div class="chart-item">
        <a href="./assets/images/screeners/SGDJPY_up_streak.png" class="lightbox" title="SGDJPY Up Streak">
            <img src="./assets/images/screeners/SGDJPY_up_streak.png" alt="SGDJPY Up Streak">
        </a>
        <h3>SGDJPY (7 days)</h3>
    </div>

    <div class="chart-item">
        <a href="./assets/images/screeners/&HG_CCB_up_streak.png" class="lightbox" title="&HG_CCB Up Streak">
            <img src="./assets/images/screeners/&HG_CCB_up_streak.png" alt="&HG_CCB Up Streak">
        </a>
        <h3>&HG_CCB (6 days)</h3>
    </div>

    <div class="chart-item">
        <a href="./assets/images/screeners/NVDA_up_streak.png" class="lightbox" title="NVDA Up Streak">
            <img src="./assets/images/screeners/NVDA_up_streak.png" alt="NVDA Up Streak">
        </a>
        <h3>NVDA (6 days)</h3>
    </div>

    <div class="chart-item">
        <a href="./assets/images/screeners/$TWMSCI_up_streak.png" class="lightbox" title="$TWMSCI Up Streak">
            <img src="./assets/images/screeners/$TWMSCI_up_streak.png" alt="$TWMSCI Up Streak">
        </a>
        <h3>$TWMSCI (5 days)</h3>
    </div>

    <div class="chart-item">
        <a href="./assets/images/screeners/$NDX_up_streak.png" class="lightbox" title="$NDX Up Streak">
            <img src="./assets/images/screeners/$NDX_up_streak.png" alt="$NDX Up Streak">
        </a>
        <h3>$NDX (5 days)</h3>
    </div>

    <div class="chart-item">
        <a href="./assets/images/screeners/AUDEUR_up_streak.png" class="lightbox" title="AUDEUR Up Streak">
            <img src="./assets/images/screeners/AUDEUR_up_streak.png" alt="AUDEUR Up Streak">
        </a>
        <h3>AUDEUR (5 days)</h3>
    </div>

</div>

<div class="section-header down-header">Down Streaks (5+ days)</div>
<div class='chart-grid'>

    <div class="chart-item">
        <a href="./assets/images/screeners/EURAUD_down_streak.png" class="lightbox" title="EURAUD Down Streak">
            <img src="./assets/images/screeners/EURAUD_down_streak.png" alt="EURAUD Down Streak">
        </a>
        <h3>EURAUD (5 days)</h3>
    </div>

    <div class="chart-item">
        <a href="./assets/images/screeners/&CL_CCB_down_streak.png" class="lightbox" title="&CL_CCB Down Streak">
            <img src="./assets/images/screeners/&CL_CCB_down_streak.png" alt="&CL_CCB Down Streak">
        </a>
        <h3>&CL_CCB (5 days)</h3>
    </div>

</div>

</body>
</html>
