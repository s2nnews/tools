<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Daily Streak Screener</title>
    <style>
        .chart-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-top: 20px;
        }
        .chart-item {
            text-align: center;
            border: 1px solid #eee;
            padding: 10px;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            transition: transform 0.3s ease;
        }
        .chart-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        .chart-item img {
            max-width: 100%;
            height: auto;
            display: block;
            margin: 0 auto;
            cursor: pointer;
        }
        .chart-item h3 {
            margin: 10px 0;
            font-size: 16px;
            color: #333;
        }
        h2 {
            text-align: center;
            margin: 20px 0;
            color: #333;
        }
        .section-header {
            text-align: center;
            padding: 10px;
            margin: 20px 0 10px 0;
            font-size: 18px;
            font-weight: bold;
            color: white;
        }
        .up-header {
            background-color: #4CAF50;
        }
        .down-header {
            background-color: #f44336;
        }
        @media (max-width: 1200px) {
            .chart-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
        @media (max-width: 768px) {
            .chart-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

<div class="section-header up-header">Up Streaks (5+ days)</div>
<div class='chart-grid'>

    <div class="chart-item">
        <a href="./assets/images/screeners/SGDGBP_up_streak.png" class="lightbox" title="SGDGBP Up Streak">
            <img src="./assets/images/screeners/SGDGBP_up_streak.png" alt="SGDGBP Up Streak">
        </a>
        <h3>SGDGBP (7 days)</h3>
    </div>

    <div class="chart-item">
        <a href="./assets/images/screeners/JPYAUD_up_streak.png" class="lightbox" title="JPYAUD Up Streak">
            <img src="./assets/images/screeners/JPYAUD_up_streak.png" alt="JPYAUD Up Streak">
        </a>
        <h3>JPYAUD (5 days)</h3>
    </div>

    <div class="chart-item">
        <a href="./assets/images/screeners/JPYCHF_up_streak.png" class="lightbox" title="JPYCHF Up Streak">
            <img src="./assets/images/screeners/JPYCHF_up_streak.png" alt="JPYCHF Up Streak">
        </a>
        <h3>JPYCHF (5 days)</h3>
    </div>

    <div class="chart-item">
        <a href="./assets/images/screeners/JPYNZD_up_streak.png" class="lightbox" title="JPYNZD Up Streak">
            <img src="./assets/images/screeners/JPYNZD_up_streak.png" alt="JPYNZD Up Streak">
        </a>
        <h3>JPYNZD (5 days)</h3>
    </div>

    <div class="chart-item">
        <a href="./assets/images/screeners/MXNEUR_up_streak.png" class="lightbox" title="MXNEUR Up Streak">
            <img src="./assets/images/screeners/MXNEUR_up_streak.png" alt="MXNEUR Up Streak">
        </a>
        <h3>MXNEUR (5 days)</h3>
    </div>

    <div class="chart-item">
        <a href="./assets/images/screeners/MXNGBP_up_streak.png" class="lightbox" title="MXNGBP Up Streak">
            <img src="./assets/images/screeners/MXNGBP_up_streak.png" alt="MXNGBP Up Streak">
        </a>
        <h3>MXNGBP (5 days)</h3>
    </div>

</div>

<div class="section-header down-header">Down Streaks (5+ days)</div>
<div class='chart-grid'>

    <div class="chart-item">
        <a href="./assets/images/screeners/GBPSGD_down_streak.png" class="lightbox" title="GBPSGD Down Streak">
            <img src="./assets/images/screeners/GBPSGD_down_streak.png" alt="GBPSGD Down Streak">
        </a>
        <h3>GBPSGD (7 days)</h3>
    </div>

    <div class="chart-item">
        <a href="./assets/images/screeners/AUDJPY_down_streak.png" class="lightbox" title="AUDJPY Down Streak">
            <img src="./assets/images/screeners/AUDJPY_down_streak.png" alt="AUDJPY Down Streak">
        </a>
        <h3>AUDJPY (5 days)</h3>
    </div>

    <div class="chart-item">
        <a href="./assets/images/screeners/CHFJPY_down_streak.png" class="lightbox" title="CHFJPY Down Streak">
            <img src="./assets/images/screeners/CHFJPY_down_streak.png" alt="CHFJPY Down Streak">
        </a>

    <div class="chart-item">
        <a href="./assets/images/screeners/EURMXN_down_streak.png" class="lightbox" title="EURMXN Down Streak">

        </a>
        <h3>EURMXN (5 days)</h3>
    </div>

    <div class="chart-item">
        <a href="./assets/images/screeners/GBPMXN_down_streak.png" class="lightbox" title="GBPMXN Down Streak">
            <img src="./assets/images/screeners/GBPMXN_down_streak.png" alt="GBPMXN Down Streak">
        </a>
        <h3>GBPMXN (5 days)</h3>
    </div>

    <div class="chart-item">
        <a href="./assets/images/screeners/NZDJPY_down_streak.png" class="lightbox" title="NZDJPY Down Streak">
            <img src="./assets/images/screeners/NZDJPY_down_streak.png" alt="NZDJPY Down Streak">
        </a>
        <h3>NZDJPY (5 days)</h3>
    </div>

</div>

</body>
</html>
