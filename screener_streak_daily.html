<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Daily Streak Screener</title>
    <style>
        .chart-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-top: 20px;
        }
        .chart-item {
            text-align: center;
            border: 1px solid #eee;
            padding: 10px;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            transition: transform 0.3s ease;
        }
        .chart-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        .chart-item img {
            max-width: 100%;
            height: auto;
            display: block;
            margin: 0 auto;
            cursor: pointer;
        }
        .chart-item h3 {
            margin: 10px 0;
            font-size: 16px;
            color: #333;
        }
        h2 {
            text-align: center;
            margin: 20px 0;
            color: #333;
        }
        .section-header {
            text-align: center;
            padding: 10px;
            margin: 20px 0 10px 0;
            font-size: 18px;
            font-weight: bold;
            color: white;
        }
        .up-header {
            background-color: #4CAF50;
        }
        .down-header {
            background-color: #f44336;
        }
        @media (max-width: 1200px) {
            .chart-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
        @media (max-width: 768px) {
            .chart-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

<div class="section-header up-header">Up Streaks (5+ days)</div>
<div class='chart-grid'>

    <div class="chart-item">
        <a href="./assets/images/screeners/USDTRY_up_streak.png" class="lightbox" title="USDTRY Up Streak">
            <img src="./assets/images/screeners/USDTRY_up_streak.png" alt="USDTRY Up Streak">
        </a>
        <h3>USDTRY (13 days)</h3>
    </div>

    <div class="chart-item">
        <a href="./assets/images/screeners/&CL_CCB_up_streak.png" class="lightbox" title="&CL_CCB Up Streak">
            <img src="./assets/images/screeners/&CL_CCB_up_streak.png" alt="&CL_CCB Up Streak">
        </a>
        <h3>&CL_CCB (8 days)</h3>
    </div>

    <div class="chart-item">
        <a href="./assets/images/screeners/USDTWD_up_streak.png" class="lightbox" title="USDTWD Up Streak">
            <img src="./assets/images/screeners/USDTWD_up_streak.png" alt="USDTWD Up Streak">
        </a>
        <h3>USDTWD (7 days)</h3>
    </div>

    <div class="chart-item">
        <a href="./assets/images/screeners/NOKUSD_up_streak.png" class="lightbox" title="NOKUSD Up Streak">
            <img src="./assets/images/screeners/NOKUSD_up_streak.png" alt="NOKUSD Up Streak">
        </a>
        <h3>NOKUSD (6 days)</h3>
    </div>

    <div class="chart-item">
        <a href="./assets/images/screeners/CNYUSD_up_streak.png" class="lightbox" title="CNYUSD Up Streak">
            <img src="./assets/images/screeners/CNYUSD_up_streak.png" alt="CNYUSD Up Streak">
        </a>
        <h3>CNYUSD (5 days)</h3>
    </div>

</div>

<div class="section-header down-header">Down Streaks (5+ days)</div>
<div class='chart-grid'>

    <div class="chart-item">
        <a href="./assets/images/screeners/USDINR_down_streak.png" class="lightbox" title="USDINR Down Streak">
            <img src="./assets/images/screeners/USDINR_down_streak.png" alt="USDINR Down Streak">
        </a>
        <h3>USDINR (8 days)</h3>
    </div>

    <div class="chart-item">
        <a href="./assets/images/screeners/TWDUSD_down_streak.png" class="lightbox" title="TWDUSD Down Streak">
            <img src="./assets/images/screeners/TWDUSD_down_streak.png" alt="TWDUSD Down Streak">
        </a>
        <h3>TWDUSD (7 days)</h3>
    </div>

    <div class="chart-item">
        <a href="./assets/images/screeners/USDNOK_down_streak.png" class="lightbox" title="USDNOK Down Streak">
            <img src="./assets/images/screeners/USDNOK_down_streak.png" alt="USDNOK Down Streak">
        </a>
        <h3>USDNOK (6 days)</h3>
    </div>

    <div class="chart-item">
        <a href="./assets/images/screeners/$SIMSCI_down_streak.png" class="lightbox" title="$SIMSCI Down Streak">
            <img src="./assets/images/screeners/$SIMSCI_down_streak.png" alt="$SIMSCI Down Streak">
        </a>

    <div class="chart-item">
        <a href="./assets/images/screeners/USDCNY_down_streak.png" class="lightbox" title="USDCNY Down Streak">

        </a>
        <h3>USDCNY (5 days)</h3>
    </div>

    <div class="chart-item">
        <a href="./assets/images/screeners/&ZC_CCB_down_streak.png" class="lightbox" title="&ZC_CCB Down Streak">
            <img src="./assets/images/screeners/&ZC_CCB_down_streak.png" alt="&ZC_CCB Down Streak">
        </a>
        <h3>&ZC_CCB (5 days)</h3>
    </div>

    <div class="chart-item">
        <a href="./assets/images/screeners/META_down_streak.png" class="lightbox" title="META Down Streak">
            <img src="./assets/images/screeners/META_down_streak.png" alt="META Down Streak">
        </a>
        <h3>META (5 days)</h3>
    </div>

</div>

</body>
</html>
