<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Daily Streak Screener</title>
    <style>
        .chart-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-top: 20px;
        }
        .chart-item {
            text-align: center;
            border: 1px solid #eee;
            padding: 10px;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            transition: transform 0.3s ease;
        }
        .chart-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        .chart-item img {
            max-width: 100%;
            height: auto;
            display: block;
            margin: 0 auto;
            cursor: pointer;
        }
        .chart-item h3 {
            margin: 10px 0;
            font-size: 16px;
            color: #333;
        }
        h2 {
            text-align: center;
            margin: 20px 0;
            color: #333;
        }
        .section-header {
            text-align: center;
            padding: 10px;
            margin: 20px 0 10px 0;
            font-size: 18px;
            font-weight: bold;
            color: white;
        }
        .up-header {
            background-color: #4CAF50;
        }
        .down-header {
            background-color: #f44336;
        }
        @media (max-width: 1200px) {
            .chart-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
        @media (max-width: 768px) {
            .chart-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

<div class="section-header up-header">Up Streaks (5+ days)</div>
<div class='chart-grid'>

    <div class="chart-item">
        <a href="./assets/images/screeners/USDRUB_up_streak.png" class="lightbox" title="USDRUB Up Streak">
            <img src="./assets/images/screeners/USDRUB_up_streak.png" alt="USDRUB Up Streak">
        </a>
        <h3>USDRUB (7 days)</h3>
    </div>

    <div class="chart-item">
        <a href="./assets/images/screeners/CZKEUR_up_streak.png" class="lightbox" title="CZKEUR Up Streak">
            <img src="./assets/images/screeners/CZKEUR_up_streak.png" alt="CZKEUR Up Streak">
        </a>
        <h3>CZKEUR (6 days)</h3>
    </div>

</div>

<div class="section-header down-header">Down Streaks (5+ days)</div>
<div class='chart-grid'>

    <div class="chart-item">
        <a href="./assets/images/screeners/$BVSP_down_streak.png" class="lightbox" title="$BVSP Down Streak">
            <img src="./assets/images/screeners/$BVSP_down_streak.png" alt="$BVSP Down Streak">
        </a>
        <h3>$BVSP (11 days)</h3>
    </div>

    <div class="chart-item">
        <a href="./assets/images/screeners/RUBUSD_down_streak.png" class="lightbox" title="RUBUSD Down Streak">
            <img src="./assets/images/screeners/RUBUSD_down_streak.png" alt="RUBUSD Down Streak">
        </a>
        <h3>RUBUSD (7 days)</h3>
    </div>

    <div class="chart-item">
        <a href="./assets/images/screeners/$CAC_down_streak.png" class="lightbox" title="$CAC Down Streak">
            <img src="./assets/images/screeners/$CAC_down_streak.png" alt="$CAC Down Streak">
        </a>
        <h3>$CAC (6 days)</h3>
    </div>

    <div class="chart-item">
        <a href="./assets/images/screeners/$NIF_down_streak.png" class="lightbox" title="$NIF Down Streak">
            <img src="./assets/images/screeners/$NIF_down_streak.png" alt="$NIF Down Streak">
        </a>
        <h3>$NIF (6 days)</h3>
    </div>

    <div class="chart-item">
        <a href="./assets/images/screeners/EURCZK_down_streak.png" class="lightbox" title="EURCZK Down Streak">
            <img src="./assets/images/screeners/EURCZK_down_streak.png" alt="EURCZK Down Streak">
        </a>
        <h3>EURCZK (6 days)</h3>
    </div>

    <div class="chart-item">
        <a href="./assets/images/screeners/AMZN_down_streak.png" class="lightbox" title="AMZN Down Streak">
            <img src="./assets/images/screeners/AMZN_down_streak.png" alt="AMZN Down Streak">
        </a>
        <h3>AMZN (6 days)</h3>
    </div>

    <div class="chart-item">
        <a href="./assets/images/screeners/$E3X_down_streak.png" class="lightbox" title="$E3X Down Streak">
            <img src="./assets/images/screeners/$E3X_down_streak.png" alt="$E3X Down Streak">
        </a>
        <h3>$E3X (5 days)</h3>
    </div>

    <div class="chart-item">
        <a href="./assets/images/screeners/$IBEX_down_streak.png" class="lightbox" title="$IBEX Down Streak">
            <img src="./assets/images/screeners/$IBEX_down_streak.png" alt="$IBEX Down Streak">
        </a>
        <h3>$IBEX (5 days)</h3>
    </div>

</div>

</body>
</html>
